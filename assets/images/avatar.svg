<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #D9CDBB; }
      .dark-shape { fill: #292824; }
      .coral-shape { fill: #E8755B; }
      .sand-shape { fill: #F3EDE2; }
      .border-line { stroke: #292824; stroke-width: 1.5; }
      .dashed { stroke: #756F64; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
      .mono-text { font-family: 'DM Mono', monospace; font-size: 11px; fill: #756F64; letter-spacing: 2px; }
      .initial-text { font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 110px; fill: #F3EDE2; }
    </style>
  </defs>

  <!-- Editorial Card Canvas -->
  <rect width="600" height="700" class="bg"/>

  <!-- Inner Frame -->
  <rect x="35" y="35" width="530" height="630" fill="#F3EDE2" stroke="#292824" stroke-width="1.5"/>

  <!-- Editorial Top Coordinates -->
  <text x="60" y="70" class="mono-text">PORTRAIT // ARCHIVE</text>
  <text x="540" y="70" class="mono-text" text-anchor="end">FIG. 01</text>
  <line x1="60" y1="85" x2="540" y2="85" stroke="#292824" stroke-width="1"/>

  <!-- Minimalist Geometric Composition representing Developer / Creator -->
  <g transform="translate(100, 120)">
    <!-- Main dark arch/silhouette container -->
    <path d="M 0 160 C 0 70, 70 0, 200 0 C 330 0, 400 70, 400 160 L 400 380 L 0 380 Z" fill="#292824"/>
    
    <!-- Accent geometric block in Coral -->
    <rect x="230" y="100" width="170" height="280" fill="#E8755B"/>
    
    <!-- Organic/Geometric cutouts -->
    <circle cx="200" cy="120" r="60" fill="#F3EDE2"/>
    <circle cx="200" cy="120" r="30" fill="#292824"/>
    
    <!-- Monogram / Typographic accent -->
    <text x="70" y="320" class="initial-text">&lt;/&gt;</text>
    
    <!-- Diagonal rule across Coral block -->
    <line x1="230" y1="180" x2="400" y2="350" stroke="#F3EDE2" stroke-width="2"/>
    <circle cx="340" cy="290" r="8" fill="#F3EDE2"/>
  </g>

  <!-- Editorial Bottom Stamp & Notes -->
  <line x1="60" y1="560" x2="540" y2="560" stroke="#292824" stroke-width="1"/>
  
  <text x="60" y="590" font-family="'DM Sans', sans-serif" font-weight="700" font-size="18" fill="#292824">DESENVOLVEDOR WEB</text>
  <text x="60" y="612" font-family="'DM Mono', monospace" font-size="12" fill="#756F64">CÓDIGO // INTERFACES // ARTE DIGITAL</text>

  <!-- Seal in bottom right -->
  <circle cx="495" cy="600" r="28" fill="#E8755B"/>
  <circle cx="495" cy="600" r="24" fill="none" stroke="#F3EDE2" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="495" y="604" font-family="'DM Mono', monospace" font-size="9" font-weight="700" fill="#F3EDE2" text-anchor="middle">AUTÊNTICO</text>
</svg>
