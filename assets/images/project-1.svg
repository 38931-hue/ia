<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #D9CDBB; }
      .sheet { fill: #F3EDE2; stroke: #292824; stroke-width: 1.5; }
      .dark-rect { fill: #292824; }
      .coral-accent { fill: #E8755B; }
      .coral-stroke { stroke: #E8755B; stroke-width: 2; fill: none; }
      .muted-line { stroke: #756F64; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
      .solid-line { stroke: #292824; stroke-width: 1.5; }
      .thin-line { stroke: rgba(41, 40, 36, 0.25); stroke-width: 1; }
      .label-text { font-family: 'DM Mono', monospace, sans-serif; font-size: 11px; fill: #756F64; letter-spacing: 1.5px; }
      .title-text { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 22px; fill: #292824; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" class="bg"/>

  <!-- Subtle editorial grid lines -->
  <line x1="60" y1="0" x2="60" y2="500" class="thin-line"/>
  <line x1="740" y1="0" x2="740" y2="500" class="thin-line"/>
  <line x1="0" y1="50" x2="800" y2="50" class="thin-line"/>
  <line x1="0" y1="450" x2="800" y2="450" class="thin-line"/>

  <!-- Editorial Card Main Window -->
  <rect x="100" y="70" width="600" height="360" rx="4" class="sheet"/>
  
  <!-- Browser-style Minimal Header Bar -->
  <rect x="100" y="70" width="600" height="38" class="dark-rect"/>
  <circle cx="125" cy="89" r="4.5" fill="#E8755B"/>
  <circle cx="140" cy="89" r="4.5" fill="#D9CDBB"/>
  <circle cx="155" cy="89" r="4.5" fill="#756F64"/>
  <text x="350" y="93" fill="#D9CDBB" font-family="'DM Mono', monospace" font-size="11" text-anchor="middle" letter-spacing="1">PROJECT-01 // EDITORIAL INTERFACE</text>

  <!-- Asymmetric Editorial Grid Content -->
  <!-- Left Column: Typography Block -->
  <text x="140" y="145" class="label-text">SPECIMEN / LAYOUT STUDY</text>
  <text x="140" y="180" class="title-text">A Modern Digital</text>
  <text x="140" y="208" class="title-text">Reading Space</text>
  
  <line x1="140" y1="230" x2="380" y2="230" class="solid-line"/>
  
  <rect x="140" y="250" width="220" height="8" rx="2" fill="#756F64" opacity="0.4"/>
  <rect x="140" y="268" width="180" height="8" rx="2" fill="#756F64" opacity="0.3"/>
  <rect x="140" y="286" width="200" height="8" rx="2" fill="#756F64" opacity="0.3"/>

  <!-- Coral CTA Mock -->
  <rect x="140" y="320" width="130" height="36" rx="2" class="coral-accent"/>
  <rect x="155" y="334" width="70" height="8" rx="2" fill="#F3EDE2"/>
  <circle cx="250" cy="338" r="4" fill="#F3EDE2"/>

  <!-- Right Column: Visual Hierarchy Module -->
  <rect x="420" y="130" width="240" height="230" rx="3" fill="#D9CDBB" stroke="#292824" stroke-width="1.5"/>
  <rect x="440" y="150" width="200" height="110" rx="2" fill="#292824"/>
  
  <!-- Abstract lines inside the dark module -->
  <line x1="460" y1="180" x2="580" y2="180" class="coral-stroke"/>
  <circle cx="610" cy="180" r="6" class="coral-accent"/>
  <rect x="460" y="205" width="110" height="6" rx="1" fill="#D9CDBB" opacity="0.7"/>
  <rect x="460" y="222" width="70" height="6" rx="1" fill="#D9CDBB" opacity="0.4"/>

  <!-- Stat bars / metadata below -->
  <rect x="440" y="280" width="90" height="40" rx="2" fill="#F3EDE2" stroke="#292824" stroke-width="1"/>
  <text x="450" y="297" font-family="'DM Mono', monospace" font-size="9" fill="#756F64">INDEX</text>
  <text x="450" y="313" font-family="'DM Sans', sans-serif" font-weight="700" font-size="13" fill="#292824">01.ALPHA</text>

  <rect x="550" y="280" width="90" height="40" rx="2" fill="#F3EDE2" stroke="#292824" stroke-width="1"/>
  <text x="560" y="297" font-family="'DM Mono', monospace" font-size="9" fill="#756F64">STATUS</text>
  <text x="560" y="313" font-family="'DM Sans', sans-serif" font-weight="700" font-size="13" fill="#E8755B">ACTIVE</text>

  <!-- Editorial Corner Stamp -->
  <text x="670" y="420" font-family="'DM Mono', monospace" font-size="10" fill="#756F64" text-anchor="end">SYS // 01</text>
</svg>
